<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TERMINAL // Stock News</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    
    <script type="module" src="https://widgets.tradingview-widget.com/w/en/tv-market-summary.js"></script>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app-layout">
      <!-- Sidebar / Navigation -->
      <aside class="sidebar collapsed" id="sidebar">
        <button class="sidebar-toggle-btn" id="sidebar-toggle">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
        </button>
        <div class="brand">
          <div class="logo-icon">SN</div>
          <span class="logo-text">TERMINAL</span>
        </div>
        
        <nav class="main-nav">
          <button class="nav-item active" data-view="dashboard">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            <span>Dashboard</span>
          </button>
          <button class="nav-item" data-view="heatmap">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
            <span>Market Map</span>
          </button>
        </nav>

        <div class="sidebar-footer">
          <div class="system-status">
            <span class="status-dot"></span>
            <span class="status-text">SYSTEM ONLINE</span>
          </div>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <!-- Top Header -->
        <header class="top-bar">
          <div class="breadcrumbs">PORTFOLIO / <span class="current-section" id="view-title">DASHBOARD</span></div>
          
          <div class="actions">
            <button class="btn btn-secondary" id="refresh-btn">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"></path><path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path><path d="M3 22v-6h6"></path><path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path></svg>
              SYNC
            </button>
          </div>
        </header>

        <!-- Scrollable Content -->
        <div class="content-area">
          
          <!-- Overview Panel -->
          <div class="overview-panel">
            <div class="overview-main">
              <div class="stat-label">PORTFOLIO VALUE</div>
              <div class="stat-value-row">
                <div class="stat-value" id="total-notional">--</div>
                <div class="stat-trend" id="portfolio-change">--</div>
              </div>
            </div>
            <div class="overview-meta">
              <div class="meta-item">
                <span class="meta-label">POSITIONS</span>
                <span class="meta-value" id="total-positions">--</span>
              </div>
            </div>
          </div>
          
          <!-- Market Summary Widget -->
          <div class="market-summary-container" id="market-summary-view">
            <tv-market-summary 
              id="market-summary-widget"
              symbol-sectors='[{"sectionName":"Stocks","symbols":[]},{"sectionName":"Indices","symbols":[]}]' 
              time-frame="7D" 
              show-time-range 
              direction="horizontal" 
              item-size="compact" 
              mode="custom" 
              transparent>
            </tv-market-summary>
          </div>

          <!-- Tabs -->
          <div class="tabs-container">
            <div class="tabs-header">
              <button class="tab-btn active" data-tab="holdings">ASSETS</button>
              <button class="tab-btn" data-tab="evaluations">INTELLIGENCE</button>
              
              <!-- Compact Quick Add -->
              <form id="quick-add-form" class="quick-add-compact">
                <input type="text" id="input-ticker" placeholder="TICKER" required autocomplete="off" />
                <input type="number" id="input-qty" placeholder="QTY" step="any" required />
                <button type="submit" class="btn-add-mini">
                  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                </button>
              </form>
            </div>
            <div class="table-wrapper">
              <table id="main-table">
                <thead></thead>
                <tbody></tbody>
              </table>
            </div>
          </div>

          <!-- Heatmap Section (Initially Hidden via CSS or below fold) -->
          <div id="heatmap-section" class="heatmap-container" style="display: none;">
            <div class="tradingview-widget-container">
              <div class="tradingview-widget-container__widget"></div>
              <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-stock-heatmap.js" async>
              {
                "dataSource": "SPX500",
                "blockSize": "market_cap_basic",
                "blockColor": "change",
                "grouping": "sector",
                "locale": "en",
                "symbolUrl": "",
                "colorTheme": "dark",
                "hasTopBar": false,
                "isDataSetEnabled": true,
                "isZoomEnabled": true,
                "hasSymbolTooltip": true,
                "isMonoSize": false,
                "width": "100%",
                "height": "100%"
              }
              </script>
            </div>
          </div>

        </div>
      </main>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
