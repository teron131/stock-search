<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TERMINAL // Stock News</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- TradingView Widgets -->
    <script
      type="module"
      src="https://widgets.tradingview-widget.com/w/en/tv-ticker-tape.js"
    ></script>
    <script
      type="module"
      src="https://widgets.tradingview-widget.com/w/en/tv-ticker-tag.js"
    ></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Bloomberg-style Dense Layout -->
    <div class="terminal-layout">
      <!-- Hidden Hamburger Menu Drawer -->
      <div id="slide-menu" class="slide-menu">
        <div class="menu-header">
          <div class="brand">TERMINAL</div>
          <button type="button" class="close-btn" id="menu-close-btn" aria-label="Close menu">&times;</button>
        </div>
        <nav class="main-nav">
          <button type="button" class="nav-item active" data-view="dashboard">DASHBOARD</button>
          <button type="button" class="nav-item" data-view="industry">INDUSTRY</button>
          <button type="button" class="nav-item" data-view="marketmap">MARKET MAP</button>
          <button type="button" class="nav-item" data-view="calendar">ECONOMIC CALENDAR</button>
        </nav>
      </div>
      <div id="menu-overlay" class="menu-overlay"></div>

      <!-- Main Content Area -->
      <main class="main-content">
        <!-- Dense Top Bar -->
        <header class="top-bar">
          <div class="top-bar-left">
            <button type="button" id="menu-open-btn" class="hamburger-btn" aria-label="Open menu">
              <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <span class="view-title" id="view-title">DASHBOARD</span>
          </div>

          <div class="top-bar-right">
            <span class="last-update" id="last-update">--</span>
            <span class="import-status" id="import-status"></span>
            <input id="import-image-input" type="file" accept="image/*" hidden aria-hidden="true" tabindex="-1" />
            <div class="action-icon-group">
              <button type="button" class="btn btn-secondary btn-icon-top" id="import-image-btn" title="Import Image">IMG</button>
              <button type="button" class="btn btn-secondary btn-icon-top" id="refresh-btn" title="Sync">SYNC</button>
            </div>
          </div>
        </header>

        <!-- Ticker Tape Widget Section -->
        <div class="ticker-tape-container" id="ticker-tape-view">
          <tv-ticker-tape
            id="ticker-tape-widget"
            symbols=""
            line-chart-type="Baseline"
            item-size="compact"
            show-hover
            transparent
            theme="dark"
          >
          </tv-ticker-tape>
        </div>

        <!-- Stats Strip (Ultra Dense) -->
        <div id="stats-strip" class="stats-strip">
          <div class="stats-item"><span class="stats-label">TOT:</span><span class="stats-value" id="total-value">--</span></div>
          <div class="stats-item"><span class="stats-label">CHG:</span><span class="stats-value stats-trend" id="portfolio-change">--</span></div>
          <div class="stats-item"><span class="stats-label">POS:</span><span class="stats-value" id="total-positions">--</span></div>
        </div>

        <!-- Preact App Root -->
        <div id="preact-root" class="terminal-grid"></div>

        <div id="secondary-views">
          <!-- Heatmap Section -->
          <div
            id="heatmap-section"
            class="heatmap-container"
            style="display: none"
          >
            <div class="tabs-header">
              <div class="tab-group">
                <button type="button" class="tab-btn active" data-source="SPX500">
                  S&P_500
                </button>
                <button type="button" class="tab-btn" data-source="NASDAQ100">
                  NASDAQ_100
                </button>
              </div>
            </div>
            <div
              class="tradingview-widget-container"
              id="heatmap-widget-container"
            >
              <div class="tradingview-widget-container__widget"></div>
            </div>
          </div>

          <!-- Economic Calendar Section -->
          <div
            id="calendar-section"
            class="calendar-container"
            style="display: none"
          >
            <div class="tradingview-widget-container" id="calendar-widget-container">
              <div class="tradingview-widget-container__widget"></div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Application Script -->
    <script type="module" src="main.js"></script>
  </body>
</html>
