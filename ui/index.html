<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TERMINAL // Stock News</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- TradingView Widgets -->
    <script
      type="module"
      src="https://widgets.tradingview-widget.com/w/en/tv-ticker-tape.js"
    ></script>
    <script
      type="module"
      src="https://widgets.tradingview-widget.com/w/en/tv-ticker-tag.js"
    ></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- System Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay" style="display: none">
      <div class="loader"></div>
      <div class="loading-text">SYNCHRONIZING TERMINAL...</div>
    </div>

    <div class="app-layout">
      <!-- Sidebar / Navigation -->
      <aside class="sidebar collapsed" id="sidebar">
        <!-- Sidebar Toggle is now the brand element -->
        <div class="brand" id="sidebar-toggle" title="Toggle Sidebar">
          <div class="logo-icon" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M3 17l6-6 4 4 7-7" />
              <path d="M14 8h7v7" />
            </svg>
          </div>
          <div class="sidebar-toggle-btn">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="9" y1="3" x2="9" y2="21"></line>
            </svg>
          </div>
        </div>

        <nav class="main-nav">
          <button class="nav-item active" data-view="dashboard">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="3" width="7" height="7"></rect>
              <rect x="14" y="3" width="7" height="7"></rect>
              <rect x="14" y="14" width="7" height="7"></rect>
              <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            <span>DASHBOARD</span>
          </button>
          <button class="nav-item" data-view="heatmap">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M3 3v18h18" />
              <path d="m19 9-5 5-4-4-3 3" />
            </svg>
            <span>MARKET_MAP</span>
          </button>
          <button class="nav-item" data-view="calendar">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <span>CALENDAR</span>
          </button>
        </nav>

        <div class="sidebar-footer">
          <div class="system-status">
            <span class="status-dot"></span>
            <span class="status-text">SYSTEM_ONLINE</span>
          </div>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <!-- Top Header -->
        <header class="top-bar">
          <div class="top-bar-left">
            <div class="breadcrumbs">
              TERMINAL /
              <span class="current-section" id="view-title">DASHBOARD</span>
            </div>
          </div>

          <div class="actions">
            <span class="last-update" id="last-update">--</span>
            <span class="import-status" id="import-status"></span>
            <input
              id="import-image-input"
              type="file"
              accept="image/*"
              class="image-upload-input"
              hidden
              aria-hidden="true"
              tabindex="-1"
            />
            <div class="action-icon-group">
              <button
                class="btn btn-secondary btn-image-import-top"
                id="import-image-btn"
                title="Click or drag an image to import holdings"
                aria-label="Import portfolio from image"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                  <circle cx="9" cy="10" r="1.5"></circle>
                  <path d="M21 16l-5-5-4 4-2-2-4 4"></path>
                </svg>
              </button>
              <button
                class="btn btn-secondary btn-icon-top"
                id="refresh-btn"
                title="Sync portfolio data"
                aria-label="Sync portfolio data"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M21 2v6h-6"></path>
                  <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
                  <path d="M3 22v-6h6"></path>
                  <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
                </svg>
              </button>
            </div>
          </div>
        </header>

        <!-- Content Area -->
        <div class="content-area">
          <!-- Ticker Tape Widget Section -->
          <div class="ticker-tape-container" id="ticker-tape-view">
            <tv-ticker-tape
              id="ticker-tape-widget"
              symbols=""
              line-chart-type="Baseline"
              item-size="compact"
              show-hover
              transparent
              theme="dark"
            >
            </tv-ticker-tape>
          </div>

          <div id="stats-strip" class="stats-strip">
            <div class="stats-item">
              <span class="stats-label">TOTAL</span>
              <span class="stats-value" id="total-value">--</span>
            </div>
            <div class="stats-item">
              <span class="stats-label">CHANGE</span>
              <span class="stats-value stats-trend" id="portfolio-change"
                >--</span
              >
            </div>
            <div class="stats-item">
              <span class="stats-label">POSITIONS</span>
              <span class="stats-value" id="total-positions">--</span>
            </div>
          </div>

          <!-- Main Dashboard Section (Preact Mount) -->
          <div id="preact-root"></div>

          <!-- Heatmap Section -->
          <div
            id="heatmap-section"
            class="heatmap-container"
            style="display: none"
          >
            <div class="tabs-header">
              <div class="tab-group">
                <button class="tab-btn active" data-source="SPX500">
                  S&P_500
                </button>
                <button class="tab-btn" data-source="NASDAQ100">
                  NASDAQ_100
                </button>
              </div>
            </div>
            <div
              class="tradingview-widget-container"
              id="heatmap-widget-container"
            >
              <div class="tradingview-widget-container__widget"></div>
              <script
                type="text/javascript"
                src="https://s3.tradingview.com/external-embedding/embed-widget-stock-heatmap.js"
                async
              >
                {
                  "dataSource": "SPX500",
                  "blockSize": "Value.Traded|1W",
                  "blockColor": "change",
                  "grouping": "sector",
                  "locale": "en",
                  "symbolUrl": "",
                  "colorTheme": "dark",
                  "exchanges": [
                    "NYSE",
                    "NASDAQ"
                  ],
                  "hasTopBar": true,
                  "isDataSetEnabled": false,
                  "isZoomEnabled": true,
                  "hasSymbolTooltip": true,
                  "isMonoSize": false,
                  "width": "100%",
                  "height": "100%"
                }
              </script>
            </div>
          </div>

          <!-- Economic Calendar Section -->
          <div
            id="calendar-section"
            class="calendar-container"
            style="display: none"
          >
            <div class="tradingview-widget-container">
              <div class="tradingview-widget-container__widget"></div>
              <script
                type="text/javascript"
                src="https://s3.tradingview.com/external-embedding/embed-widget-events.js"
                async
              >
                {
                  "colorTheme": "dark",
                  "isTransparent": false,
                  "locale": "en",
                  "countryFilter": "us",
                  "importanceFilter": "-1,0,1",
                  "width": "100%",
                  "height": "100%"
                }
              </script>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Application Script -->
    <script type="module" src="main.js"></script>
  </body>
</html>
