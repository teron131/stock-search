<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TERMINAL // Stock News</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app-layout">
      <!-- Sidebar / Navigation -->
      <aside class="sidebar">
        <div class="brand">
          <div class="logo-icon"></div>
          <span class="logo-text">TERMINAL</span>
        </div>
        
        <nav class="main-nav">
          <button class="nav-item active" data-view="dashboard">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            Dashboard
          </button>
          <button class="nav-item" data-view="heatmap">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
            Market Map
          </button>
        </nav>

        <div class="sidebar-footer">
          <div class="system-status">
            <span class="status-dot"></span>
            <span class="status-text">SYSTEM ONLINE</span>
          </div>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <!-- Top Header -->
        <header class="top-bar">
          <div class="breadcrumbs">PORTFOLIO / <span class="current-section">OVERVIEW</span></div>
          
          <div class="actions">
            <button class="btn btn-secondary" id="refresh-btn">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"></path><path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path><path d="M3 22v-6h6"></path><path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path></svg>
              SYNC
            </button>
            <button class="btn btn-primary" id="add-ticker-btn">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              ADD TICKER
            </button>
          </div>
        </header>

        <!-- Scrollable Content -->
        <div class="content-area">
          
          <!-- Stats Grid -->
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-label">Total Positions</div>
              <div class="stat-value" id="total-positions">--</div>
              <div class="stat-trend neutral">--</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Portfolio Value</div>
              <div class="stat-value" id="total-notional">--</div>
              <div class="stat-trend" id="portfolio-change">--</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Top Performer</div>
              <div class="stat-value" id="top-gainer-ticker">--</div>
              <div class="stat-trend positive" id="top-gainer-value">--</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Market Status</div>
              <div class="stat-value status-ok">OPEN</div>
              <div class="stat-trend neutral">NYSE / NASDAQ</div>
            </div>
          </div>

          <!-- Tabs -->
          <div class="tabs-container">
            <div class="tabs-header">
              <button class="tab-btn active" data-tab="holdings">ASSETS</button>
              <button class="tab-btn" data-tab="evaluations">INTELLIGENCE</button>
            </div>
            <div class="table-wrapper">
              <table id="main-table">
                <thead></thead>
                <tbody></tbody>
              </table>
            </div>
          </div>

          <!-- Heatmap Section (Initially Hidden via CSS or below fold) -->
          <div id="heatmap-section" class="heatmap-container" style="display: none;">
            <div class="tradingview-widget-container">
              <div class="tradingview-widget-container__widget"></div>
              <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-stock-heatmap.js" async>
              {
                "dataSource": "SPX500",
                "blockSize": "market_cap_basic",
                "blockColor": "change",
                "grouping": "sector",
                "locale": "en",
                "symbolUrl": "",
                "colorTheme": "dark",
                "hasTopBar": false,
                "isDataSetEnabled": true,
                "isZoomEnabled": true,
                "hasSymbolTooltip": true,
                "width": "100%",
                "height": "100%"
              }
              </script>
            </div>
          </div>

        </div>
      </main>
    </div>

    <!-- Add Ticker Modal -->
    <div class="modal-overlay" id="add-modal">
      <div class="modal">
        <div class="modal-header">
          <h3>NEW ASSET ENTRY</h3>
          <button class="close-btn" id="close-modal">&times;</button>
        </div>
        <form id="add-ticker-form">
          <div class="form-group">
            <label>TICKER SYMBOL</label>
            <input type="text" id="input-ticker" placeholder="e.g. AAPL" required autocomplete="off" />
          </div>
          <div class="form-group">
            <label>QUANTITY</label>
            <input type="number" id="input-qty" placeholder="0.00" step="any" required />
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" id="cancel-modal">CANCEL</button>
            <button type="submit" class="btn btn-primary">EXECUTE</button>
          </div>
        </form>
      </div>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
