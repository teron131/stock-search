<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stock Search</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="container">
      <nav class="nav">
        <div class="nav-left">
          <span class="logo">Stock Search</span>
        </div>
        <div class="nav-right">
          <div class="stat">
            <span class="stat-label">Positions</span>
            <span class="stat-value" id="total-positions">--</span>
          </div>
          <div class="stat">
            <span class="stat-label">Notional</span>
            <span class="stat-value" id="total-notional">--</span>
          </div>
          <button class="btn-refresh" id="refresh">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 2v6h-6"></path>
              <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
              <path d="M3 22v-6h6"></path>
              <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
            </svg>
            Refresh
          </button>
        </div>
      </nav>

      <main class="content">
        <section class="card holdings">
          <div class="card-header">
            <h2>Holdings</h2>
          </div>
          <div class="table-container">
            <table id="dashboard-table">
              <thead></thead>
              <tbody></tbody>
            </table>
          </div>
        </section>

        <section class="card heatmap">
          <div class="card-header">
            <h2>Market Heatmap</h2>
          </div>
          <div class="tradingview-widget-container">
            <div class="tradingview-widget-container__widget"></div>
            <script
              type="application/json"
              src="https://s3.tradingview.com/external-embedding/embed-widget-stock-heatmap.js"
              async
            >
              {
                "dataSource": "SPX500",
                "blockSize": "market_cap_basic",
                "blockColor": "change",
                "grouping": "sector",
                "locale": "en",
                "symbolUrl": "",
                "colorTheme": "dark",
                "hasTopBar": false,
                "isDataSetEnabled": true,
                "isZoomEnabled": true,
                "hasSymbolTooltip": true,
                "width": "100%",
                "height": "100%"
              }
            </script>
          </div>
        </section>
      </main>
    </div>
    <script src="/static/app.js"></script>
  </body>
</html>
