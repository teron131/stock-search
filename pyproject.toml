[project]
name = "stock-search"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.41.0",
    "fastapi>=0.116.1",
    "google-genai>=1.25.0",
    "ib-async>=2.0.1",
    "iprogress>=0.4",
    "ipykernel>=7.1.0",
    "ipython>=9.4.0",
    "ipywidgets>=8.1.8",
    "langchain>=1.2.0",
    "langgraph>=0.2.0",
    "langchain-openai>=1.1.6",
    "python-dotenv>=1.1.1",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "tavily-python>=0.7.10",
    "tqdm>=4.67.1",
    "uvicorn>=0.40.0",
    "yfinance>=0.2.65",
    "pandas>=2.2.3",
    "pydoll-python>=2.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.setuptools]
packages = ["stock_search"]
