[project]
name = "stock-search"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "docling>=2.41.0",
    "exa-py>=2.4.0",
    "fastapi>=0.116.1",
    "google-genai>=1.25.0",
    "httpx>=0.28.1",
    "ib-async>=2.0.1",
    "iprogress>=0.4",
    "langchain>=1.2.0",
    "langchain-openai>=1.1.6",
    "langgraph>=0.2.0",
    "llm-harness",
    "pandas>=2.2.3",
    "python-dotenv>=1.1.1",
    "python-multipart>=0.0.22",
    "rich>=14.0.0",
    "selectolax>=0.4.7",
    "shapely>=2.1.2",
    "tiktoken>=0.12.0",
    "tqdm>=4.67.1",
    "uvicorn>=0.40.0",
    "yfinance>=0.2.65",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.setuptools]
packages = ["stock_search"]

[tool.ruff]
line-length = 180

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F",
    "B", "B9",
    "I",
    "UP",
    "SIM",
    "C4",
    "ARG",
    "DTZ",
    "G",
    "S",
    "RUF",
    "PT",
    "PIE",
    "T20",
]
ignore = [
    "B008",
    "S101",
    "S105",
    "S106",
    "G004",
    "T201",
    "S112",
    "E731",
    "S311",
]
unfixable = [
    "DTZ",
    "S",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/**/*" = ["S101", "ARG", "T20"]
"test_*.py" = ["S101", "ARG", "T20"]
"*.ipynb" = ["T20", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["package_name"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
docstring-code-format = true

[tool.uv.workspace]
members = [
    "llm-harness",
]

[tool.uv.sources]
llm-harness = { workspace = true }
