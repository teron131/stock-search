[project]
name = "stock-search"
version = "0.1.0"
description = "Correlation tooling kept from the original Python implementation."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.2.3",
    "numpy>=2.2.0",
    "yfinance>=0.2.65",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.setuptools]
packages = ["stock_search"]

[tool.ruff]
line-length = 180

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F",
    "B", "B9",
    "I",
    "UP",
    "SIM",
    "C4",
    "ARG",
    "DTZ",
    "G",
    "S",
    "RUF",
    "PT",
    "PIE",
    "T20",
]
ignore = [
    "B008",
    "S101",
    "S105",
    "S106",
    "G004",
    "T201",
    "S112",
    "E731",
    "S311",
]
unfixable = [
    "DTZ",
    "S",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/**/*" = ["S101", "ARG", "T20"]
"test_*.py" = ["S101", "ARG", "T20"]
"*.ipynb" = ["T20", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["package_name"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
