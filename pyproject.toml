[project]
name = "stock-search"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.41.0",
    "google-genai>=1.25.0",
    "ib-async>=2.0.1",
    "langchain-community>=0.3.27",
    "langchain-google-genai>=2.1.8",
    "python-dotenv>=1.1.1",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "tavily-python>=0.7.10",
    "yfinance>=0.2.65",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.setuptools]
packages = ["stock_search"]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "ipython>=9.4.0",
]
